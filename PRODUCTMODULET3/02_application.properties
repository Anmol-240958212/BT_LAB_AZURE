# =====================================================================
#  Product & Pricing Module - Spring Boot configuration
#  Banking Technology Lab (CSF 3142) - Lab L5 - Group 8
# =====================================================================

spring.application.name=product-pricing-service

# Each module runs on its own port so all four can run side by side on one machine:
#   8081 Login/Auth   8082 Product & Pricing   8083 FD Calculator   8084 FD Account
server.port=8082

# ---------------------------------------------------------------------
#  MySQL datasource
#  Create the database and tables first by running
#  src/main/resources/db/product_pricing_schema.sql in MySQL Workbench.
#  Credentials come from environment variables (DB_USERNAME / DB_PASSWORD)
#  and fall back to root / root for local development.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/banking_product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:#Iamgood1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
#  JPA / Hibernate
#  The SQL script owns the schema. "validate" makes Hibernate compare every
#  @Entity mapping with the live tables at startup and refuse to start on a
#  mismatch (missing table/column, wrong type) - it never creates or alters
#  tables, so the constraints written in the DDL can never be silently lost.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=false
# Sessions end when the service method ends, not when the HTTP response is written
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
#  JSON
# ---------------------------------------------------------------------
# LocalDate -> "2025-07-01", LocalDateTime -> "2025-07-01T10:15:30" (not epoch numbers)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------
#  Error responses / logging
# ---------------------------------------------------------------------
# Include the exception message in the default error JSON (useful in Postman during the labs)
server.error.include-message=always
logging.level.com.bankingtech.product=DEBUG
logging.level.org.hibernate.tool.schema=INFO
