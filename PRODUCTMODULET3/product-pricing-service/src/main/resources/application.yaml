spring:
  application:
    name: product-pricing-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/banking_product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata"
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:#Iamgood1}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

product:
  jwt:
    secret: ${AUTH_JWT_SECRET:my-super-secret-key-for-authentication-123456789}
  cors:
    allowed-origin-patterns: "${PRODUCT_CORS_ALLOWED_ORIGINS:http://localhost:[*]|http://127.0.0.1:[*]}"

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
