# =====================================================================
# Product & Pricing Module - Banking Technology Lab (CSF 3142), Group 8
# =====================================================================
spring.application.name=product-pricing-service
server.port=8082

# Must match AUTHMODULET1's JWT signing secret. Override via environment in shared deployments.
product.jwt.secret=${AUTH_JWT_SECRET:my-super-secret-key-for-authentication-123456789}
product.cors.allowed-origin-patterns=${PRODUCT_CORS_ALLOWED_ORIGINS:http://localhost:[*]|http://127.0.0.1:[*]}

# ---------------------------------------------------------------------
# MySQL connection
# ---------------------------------------------------------------------
# createDatabaseIfNotExist=true -> the driver creates an EMPTY banking_product_db
# on first connect, then Flyway creates the 10 core tables plus product_audit.
# Credentials come from environment variables so nothing secret is committed:
#     set DB_USERNAME=root      (Windows cmd)   /   export DB_USERNAME=root (Linux/macOS)
#     set DB_PASSWORD=...
# If the variables are not set, the value after the ":" is used.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/banking_product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# Flyway - owns the schema
# ---------------------------------------------------------------------
# V1__init_schema.sql        -> the 10 core tables with PK / FK / UNIQUE / CHECK constraints
# V2__seed_reference_data.sql -> product_type_master + charge master rows
# V3__product_audit.sql      -> authenticated product-management audit trail
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# If the tables were already created by hand (database/banking_product_db.sql in
# MySQL Workbench), Flyway records a baseline instead of failing on a non-empty
# schema, then only applies migrations newer than the baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# validate = Hibernate never touches the schema; on startup it checks that every
# @Entity / @Column matches a real table / column and REFUSES TO START if not.
# That is the automated proof that the entity classes match the Flyway DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=INFO
