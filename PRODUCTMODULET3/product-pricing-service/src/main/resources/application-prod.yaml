server:
  port: ${PORT:8082}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:banking_product_db}?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

product:
  jwt:
    secret: ${AUTH_JWT_SECRET}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}

app:
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:false}
