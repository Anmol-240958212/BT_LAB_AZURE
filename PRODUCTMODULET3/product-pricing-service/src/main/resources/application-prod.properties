# Azure MySQL deployments must use TLS and validate the server certificate
# against the JVM trust store. Use a JVM trust store containing the database CA.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/banking_product_db?createDatabaseIfNotExist=true&sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Kolkata


product.jwt.secret=${AUTH_JWT_SECRET}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
