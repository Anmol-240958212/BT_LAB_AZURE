<div *ngIf="pageLoadFailed" class="page-load-recovery" role="alert">
  <span>This page could not load. The app may have been updated or the connection interrupted. Reload to try again; unsaved form entries will be lost.</span>
  <button type="button" class="btn btn-primary" (click)="reloadPage()">Reload app</button>
</div>
