spring:
  application:
    name: auth

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:authandcust}
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:#Iamgood1}"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:60000}
      metadata.max.age.ms: ${KAFKA_METADATA_MAX_AGE_MS:180000}
      connections.max.idle.ms: ${KAFKA_CONNECTIONS_MAX_IDLE_MS:180000}
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000

  mail:
    host: ${BANKING_SMTP_HOST:smtp.gmail.com}
    port: ${BANKING_SMTP_PORT:587}
    username: "${BANKING_SMTP_USERNAME:${MAIL_USERNAME:}}"
    password: "${BANKING_SMTP_PASSWORD:${MAIL_PASSWORD:}}"
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: ${BANKING_SMTP_AUTH:true}
          starttls:
            enable: ${BANKING_SMTP_STARTTLS:true}
            required: ${BANKING_SMTP_STARTTLS:true}

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${AUTH_JWT_SECRET:my-super-secret-key-for-authentication-123456789}

app:
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGINS:http://localhost:[*]|http://127.0.0.1:[*]}"
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
