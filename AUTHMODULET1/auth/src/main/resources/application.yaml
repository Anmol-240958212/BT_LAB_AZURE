spring:
  application:
    name: auth

  datasource:
    url: jdbc:mysql://localhost:3306/authandcust
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:#Iamgood1}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000

server:
  port: 8080