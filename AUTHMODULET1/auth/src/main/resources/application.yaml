spring:
  application:
    name: auth

  datasource:
    url: jdbc:mysql://localhost:3306/authandcust
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:#Iamgood1}"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000

  mail:
    host: ${BANKING_SMTP_HOST:smtp.gmail.com}
    port: ${BANKING_SMTP_PORT:587}
    username: "${BANKING_SMTP_USERNAME:${MAIL_USERNAME:}}"
    password: "${BANKING_SMTP_PASSWORD:${MAIL_PASSWORD:}}"
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: ${BANKING_SMTP_AUTH:true}
          starttls:
            enable: ${BANKING_SMTP_STARTTLS:true}
            required: ${BANKING_SMTP_STARTTLS:true}

server:
  port: 8080
