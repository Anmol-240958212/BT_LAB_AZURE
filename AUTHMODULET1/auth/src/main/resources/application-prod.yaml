server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:authandcust}?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

security:
  jwt:
    secret: ${AUTH_JWT_SECRET}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:false}
