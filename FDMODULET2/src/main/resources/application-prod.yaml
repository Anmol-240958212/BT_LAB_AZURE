server:
  port: ${PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:fdmodule}?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:false}
    reply-group-suffix: ${KAFKA_REPLY_GROUP_SUFFIX:azure-v1}
